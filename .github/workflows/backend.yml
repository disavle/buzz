name: Backend

on:
  pull_request:
    paths: ["Backend/**", "Shared/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v5
      - name: Vapor tests
        run: swift test --package-path Backend
