name: iOS

on:
  pull_request:
    paths: ["iOS/**", "Shared/**", "mise.toml", ".github/workflows/ios.yml"]
  push:
    branches: [main]
    tags: ["ios-v*"]        # a tag like ios-v0.1.0 sends a build to TestFlight
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: jdx/mise-action@v3     # installs tuist and ruby from mise.toml and caches them
      - name: Linters
        run: mise run lint && mise run lint:imports
      - name: Tests
        # Run tests even when the linters fail, so one push shows both results.
        if: success() || failure()
        run: mise run test
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: test-results
          path: iOS/fastlane/test_output

  beta:
    needs: test
    if: startsWith(github.ref, 'refs/tags/ios-v')
    runs-on: macos-26
    env:
      TUIST_TEAM_ID: ${{ secrets.TEAM_ID }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: jdx/mise-action@v3
      - name: TestFlight
        run: |
          mise run setup:gems
          cd iOS && bundle exec fastlane beta
