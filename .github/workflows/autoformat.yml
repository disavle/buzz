# Temporary: formats the code once on macOS and pushes the result back to this branch.
name: Autoformat (temporary)

on:
  push:
    branches: [ci/fix-actions]
    paths: [".github/workflows/autoformat.yml"]

permissions:
  contents: write

jobs:
  format:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: jdx/mise-action@v3
      - name: Format
        run: |
          mise run format
          swiftlint --fix --quiet || true
      - name: Commit
        run: |
          git config user.name "Disavle"
          git config user.email "69400943+disavle@users.noreply.github.com"
          git add -A iOS Shared Backend
          git diff --cached --quiet || git commit -m "Format code with swift-format and swiftlint --fix"
          git push
      - name: What is left
        continue-on-error: true
        run: |
          xcrun swift-format lint --strict --recursive --parallel iOS/App iOS/Modules Shared/Sources Backend/Sources || true
          swiftlint lint --quiet --strict || true
