# swift-format handles formatting, SwiftLint catches real code problems.
included:
  - iOS/App
  - iOS/Modules
  - Shared/Sources
  - Backend/Sources
excluded:
  - iOS/Derived
  - iOS/Tuist/.build
disabled_rules:
  - trailing_comma
  - opening_brace
  - line_length          # swift-format controls line length
opt_in_rules:
  - sorted_first_last
  - contains_over_filter_count
  - weak_delegate
# first_where and empty_count are not used: they mistake Fluent queries and model fields
# like `HourBucket.count` for collections, and `swiftlint --fix` then breaks the build.

analyzer_rules:          # run only by `swiftlint analyze`
  - unused_declaration

# Short names are fine where they are the domain words: ml, mg, to, db, tz, ru, en.
identifier_name:
  min_length:
    warning: 1
    error: 1

# Reducers and mock routers are one big switch by design.
cyclomatic_complexity:
  ignores_case_statements: true

function_body_length:
  warning: 80
  error: 100

large_tuple:
  warning: 3
  error: 4
